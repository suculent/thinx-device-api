# THiNX production swarm stack.
#
# Reconciled against the live stack on 2026-09-18 from
# micro:/mnt/gluster/deployment/swarm/thinx.yml, cross-checked against the
# running services with `docker service inspect`. Keep it that way: this file
# is what `docker stack deploy` uses, so drift here silently changes routing.
#
# environment must be first imported using:
# $ export $(cat .env)
# until .env file is supported (if ever)

version: '3.7'

networks:
  traefik-public:
    external: true
  internal:
    driver: overlay
    attachable: true

# SEC-CFG-01 (#418) / SEC-CFG-02 (phase 24): lib/thinx/secrets.js (and its
# copies in the worker and transformer images) prefers /run/secrets/<NAME> over
# the matching ${...} env var, falling back to env when the file is absent.
#
# Live state as of the 2026-09-29 rollout (names only, never values):
#
#   api          CSRF_SECRET, SLACK_BOT_TOKEN, SLACK_WEBHOOK,
#                GITHUB_CLIENT_SECRET, GOOGLE_OAUTH_SECRET, MAILGUN_API_KEY,
#                GIT_KEY_PASSPHRASE, ROLLBAR_SERVER_TOKEN, WORKER_SECRET,
#                INFLUXDB_TOKEN (Phase 27, mounted 2026-10-03)
#   worker       WORKER_SECRET, ROLLBAR_SERVER_TOKEN
#   transformer  ROLLBAR_SERVER_TOKEN
#
# INFLUXDB_TOKEN (Phase 27) is the InfluxDB 2 org all-access token the API
# uses for statistics. It was minted inside the swarm by
# `influx auth create --all-access`, its JSON piped through `jq -j .token`
# straight into `docker secret create INFLUXDB_TOKEN -`; it was never printed
# or stored anywhere else. InfluxDB 2.9 keeps tokens hashed, so rotating it
# means minting a new one the same way. INFLUXDB_OPERATOR_TOKEN and
# INFLUXDB_ADMIN_PASSWORD also exist in the swarm but are mounted on NO service
# and are not declared here (D-11): they are operator-only.
#
# Every secret below is declared `external: true`, so it MUST exist in the
# swarm before any `docker stack deploy`, or the deploy is rejected with
# "secret not found". They were created on a manager node: carried-over values
# come from the running service's env, and CSRF_SECRET and WORKER_SECRET are
# random (WORKER_SECRET was rotated, so its env value is the old one). The
# pattern, with no value ever printed:
#
#   docker service inspect thinx_api \
#     --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' \
#     | sed -n 's/^SLACK_WEBHOOK=//p' | tr -d '\n' | docker secret create SLACK_WEBHOOK -
#   openssl rand -hex 32 | tr -d '\n' | docker secret create CSRF_SECRET -
#
# ROLLBAR_SERVER_TOKEN holds the value of ROLLBAR_ACCESS_TOKEN.
#
# The env vars below are kept deliberately (D-06): they remain the fallback
# path and are still what a non-swarm `docker compose` run uses. Removing them
# is SEC-CFG-03.
#
# COUCHDB_USER, COUCHDB_PASS and REDIS_PASSWORD exist in the swarm but are NOT
# mounted on the live thinx_api yet; mounting them is SEC-CFG-04.
# REGISTRY_HTTP_SECRET and ROLLBAR_TOKEN (stale) also exist in the swarm but are
# not used by this stack. SLACK_CLIENT_SECRET is not created while Slack OAuth
# is off (its env value is empty).
secrets:
  COUCHDB_USER:
    external: true
  COUCHDB_PASS:
    external: true
  REDIS_PASSWORD:
    external: true
  SLACK_BOT_TOKEN:
    external: true
  SLACK_WEBHOOK:
    external: true
  GITHUB_CLIENT_SECRET:
    external: true
  GOOGLE_OAUTH_SECRET:
    external: true
  MAILGUN_API_KEY:
    external: true
  ROLLBAR_SERVER_TOKEN:
    external: true
  WORKER_SECRET:
    external: true
  GIT_KEY_PASSPHRASE:
    external: true
  CSRF_SECRET:
    external: true
  INFLUXDB_TOKEN:
    external: true

services:

  mosquitto:
    image: thinxcloud/mosquitto:latest
    # password is injected through the thinx.pw file in test - files backend must be enabled there; otherwise uses Redis/GoAuth plugin
    ports:
      - 1883:1883
      - 1884:1884
      - 8883:8883
    networks:
      - traefik-public
      - internal
    volumes:
      - '/mnt/gluster/thinx/mosquitto/config/mosquitto.conf:/etc/mosquitto/mosquitto.conf'
      - '/mnt/gluster/thinx/mosquitto/data:/mqtt/data'
      - '/mnt/gluster/thinx/mosquitto/auth:/mqtt/auth'
      - '/mnt/gluster/thinx/ssl:/mqtt/ssl'

    deploy:
      resources:
        reservations:
          cpus: '0.05'
          memory: 32M
        limits:
          cpus: '0.1'
          memory: 64M
      labels:
        - "traefik.tcp.services.mosquitto.loadbalancer.server.port=8883"
        - "traefik.tcp.routers.mosquitto-secure.entrypoints=mqtts"
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "swarmpit.service.deployment.autoredeploy=true"

  couchdb:
    # Docker Hardened Image: runs as uid/gid 65532 and cannot chown, so the bind
    # sources below must be owned by 65532:65532. Data written by Docker Hub
    # couchdb is owned by 5984 and needs a one-time chown before switching.
    # Nodes pull from dhi.io: `docker login dhi.io` + `stack deploy --with-registry-auth`.
    image: 'dhi.io/couchdb:3'
#    healthcheck:
#      # No curl in the hardened image; probe /_up with bash instead.
#      test:
#        - CMD
#        - bash
#        - '-c'
#        - 'exec 3<>/dev/tcp/127.0.0.1/5984 && printf "GET /_up HTTP/1.0\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200 "'
#      interval: 10s
#      timeout: 50s
#      retries: 5
    environment:
      - "NODENAME=${NODENAME}"
      - "COUCHDB_USER=${COUCHDB_USER}"
      - "COUCHDB_PASSWORD=${COUCHDB_PASSWORD}"
      - "COUCHDB_ADMIN=${COUCHDB_USER}"
      - "COUCHDB_PASS=${COUCHDB_PASSWORD}"
      - "COUCHDB_COOKIE=${COUCHDB_COOKIE}"
      - "COUCHDB_SECRET=${COUCHDB_SECRET}"
    networks:
      - traefik-public # not in production!
      - internal
# for production

    volumes:
    
      - type: bind
        source: /mnt/gluster/thinx/couchdb
        target: /opt/couchdb/data

      - type: bind
        source: /mnt/gluster/thinx/vm.args
        target: /opt/couchdb/etc/vm.args

      # probably deprecated
      - type: bind
        source: /mnt/gluster/thinx/couchdb
        target: /var/lib/couchdb

    deploy:
      resources:
        reservations:
          cpus: '0.1'
          memory: 128M
        limits:
          cpus: '0.2'
          memory: 256M
      labels:
        - swarmpit.service.deployment.autoredeploy=true

        - "traefik.http.services.thinx-db.loadbalancer.server.port=5985"
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.constraint-label=traefik-public"

        - "traefik.http.routers.thinx-db-http.rule=Host(`db.thinx.cloud`)"
        - "traefik.http.routers.thinx-db-http.entrypoints=http"
        - "traefik.http.routers.thinx-db-http.middlewares=couch-auth,https-redirect"

        - "traefik.http.routers.thinx-db-https.rule=Host(`db.thinx.cloud`)"
        - "traefik.http.routers.thinx-db-https.entrypoints=https"
        - "traefik.http.routers.thinx-db-https.tls=true"
        - "traefik.http.routers.thinx-db-https.tls.certresolver=le"
        - "traefik.http.routers.thinx-db-https.middlewares=couch-auth,error-pages-middleware"

        - traefik.http.middlewares.couch-auth.basicauth.users=${USERNAME?Variable not set}:${HASHED_PASSWORD?Variable not set}

  thinx-redis:
    networks:
      - internal
    image: thinxcloud/redis:latest
    command:
      - redis-server
      - '--requirepass'
      - '${REDIS_PASSWORD}'
      - '--port'
      - '6379'
    environment:
      - "ALLOW_EMPTY_PASSWORD=no"
      - "REDIS_PASSWORD=${REDIS_PASSWORD}"
      - "REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL"
    volumes:
      - '/mnt/gluster/thinx/redis:/data'
    deploy:
      resources:
        reservations:
          cpus: '0.05'
          memory: 16M
        limits:
          cpus: '0.1'
          memory: 64M
      labels:
        - "swarmpit.service.deployment.autoredeploy=true"

  transformer:
    user: transformer
    image: thinxcloud/transformer:latest
    environment:
      # SQREEN_* are dead config — the service was retired after the Datadog
      # acquisition. Carried over so this file matches the live stack; safe to
      # drop from here and from .env together.
      - "SQREEN_APP_NAME=${SQREEN_APP_NAME}"
      - "SQREEN_TOKEN=${SQREEN_TOKEN}"
      - "ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}"
      - "ROLLBAR_ENVIRONMENT=${ROLLBAR_ENVIRONMENT}"
      - "REVISION=2"
    secrets:
      - ROLLBAR_SERVER_TOKEN
    networks:
      - internal
    labels:
      - traefik.backend.transformer.noexpose
    deploy:
      resources:
        reservations:
          cpus: '0.01'
          memory: 64M
        limits:
          cpus: '0.25'
          memory: 64M
      placement:
        constraints:
          - node.hostname == micro
      labels:
        - swarmpit.service.deployment.autoredeploy=true
      
  api:
    depends_on:
      - transformer
      - thinx-redis
      - mosquitto
      - influxdb
      - couchdb
    networks:
      - internal
      - traefik-public
    image: ${REGISTRY}/thinx/api:swarm
    # Mounted at /run/secrets/<NAME>; read via lib/thinx/secrets.js. See the
    # top-level `secrets:` block for the creation step.
    secrets:
      # Declared here but NOT mounted on the live thinx_api yet (SEC-CFG-04).
      - COUCHDB_USER
      - COUCHDB_PASS
      - REDIS_PASSWORD
      - SLACK_BOT_TOKEN
      - SLACK_WEBHOOK
      - GITHUB_CLIENT_SECRET
      - GOOGLE_OAUTH_SECRET
      - MAILGUN_API_KEY
      - ROLLBAR_SERVER_TOKEN
      - WORKER_SECRET
      - GIT_KEY_PASSPHRASE
      - CSRF_SECRET
      - INFLUXDB_TOKEN
    environment:
      - "ENVIRONMENT=${ENVIRONMENT}"
      - "COUCHDB_USER=${COUCHDB_USER}"
      - "COUCHDB_PASS=${COUCHDB_PASS}"
      - "ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}"
      - "ROLLBAR_ENVIRONMENT=${ROLLBAR_ENVIRONMENT}"
      - "REDIS_PASSWORD=${REDIS_PASSWORD}"
      - "THINX_HOSTNAME=${THINX_HOSTNAME}"
      - "SQREEN_APP_NAME=${SQREEN_APP_NAME}"
      - "SQREEN_TOKEN=${SQREEN_TOKEN}"
      - "APP_HOSTNAME=${APP_HOSTNAME}"
      - "WEB_HOSTNAME=${WEB_HOSTNAME}"
      - "API_HOSTNAME=${API_HOSTNAME}"
      - "ENTERPRISE=${ENTERPRISE}"
      - "WORKER_SECRET=${WORKER_SECRET}"
      - "GOOGLE_OAUTH_ID=${GOOGLE_OAUTH_ID}"
      - "GOOGLE_OAUTH_SECRET=${GOOGLE_OAUTH_SECRET}"
      - "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}"
      - "GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}"
      - "GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}"
      - "SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}"
      - "SLACK_WEBHOOK=${SLACK_WEBHOOK}"
      - "MAILGUN_API_KEY=${MAILGUN_API_KEY}"
      - "GIT_KEY_PASSPHRASE=${GIT_KEY_PASSPHRASE}"
      # Phase 25: CSRF_MODE legacy|observe|signed; roll back with CSRF_MODE=legacy. CSRF_ENFORCE stays true.
      - "CSRF_ENFORCE=true"
      - "CORS_ENFORCE=true"
      - "THINX_MQTT_DEVICE_WRITES=1"
      - "CSRF_MODE=signed"
    ports:
      - 7442:7442
    volumes:
      - '/mnt/gluster/thinx/deploy:/mnt/data/deploy'
      - '/mnt/gluster/thinx/mosquitto:/mnt/data/mosquitto'
      - '/mnt/gluster/thinx/repos:/mnt/data/repos'
      - '/mnt/gluster/thinx/ssl:/mnt/data/ssl'
      - '/mnt/gluster/thinx/ssh_keys:/mnt/data/ssh_keys'
      - '/mnt/gluster/thinx/conf:/mnt/data/conf'
      - '/mnt/gluster/thinx/statistics:/mnt/data/statistics'
      - '/mnt/gluster/thinx/test-reports:/mnt/data/test-reports'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '/var/lib/docker'
      - '/cache'
    deploy:
      resources:
        reservations:
          cpus: '0.3'
          memory: 256M
        limits:
          cpus: '1.0'
          memory: 256M
      labels:
        - "traefik.http.services.thinx-api.loadbalancer.server.port=7442"
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.constraint-label=traefik-public"

        - "traefik.http.routers.thinx-api-http.rule=Host(`${THINX_HOSTNAME}`)"
        - "traefik.http.routers.thinx-api-http.entrypoints=http"
#        - "traefik.http.routers.thinx-api-http.middlewares=https-redirect"

        - "traefik.http.routers.thinx-api-https.rule=Host(`${THINX_HOSTNAME}`)"
        - "traefik.http.routers.thinx-api-https.entrypoints=https"
        - "traefik.http.routers.thinx-api-https.tls=true"
        - "traefik.http.routers.thinx-api-https.tls.certresolver=le"
        - "traefik.http.routers.thinx-api-https.middlewares=sslheaders@swarm,security-headers@swarm"
        - "swarmpit.service.deployment.autoredeploy=true"

        # NGINX Entrypoint for WSS
        # - "traefik.http.routers.nginx.rule=Host(`${THINX_HOSTNAME}`)"
        # - "traefik.http.routers.nginx.entrypoints=websecure"
        # - "traefik.http.routers.nginx.tls.certresolver=le"
        # - "traefik.http.services.nginx.loadbalancer.server.port=7442"

        # Websocket support headers.
        #
        # SEC-PROXY-01: X-Forwarded-Proto is also what lets the API mark session
        # cookies Secure. The container terminates plain HTTP, so express-session
        # negotiates cookie.secure from req.secure, which is only true when this
        # header arrives AND `trust proxy` accepts the hop it came from (see
        # lib/middleware/cookie-policy.js). Both routers below must keep
        # referencing sslheaders@swarm — declaring the middleware is not enough.
        # Phase 31 (EDGE-MIG-02): the suffix is @swarm because Traefik v3 discovers swarm
        # services through its separate swarm provider (the v2 docker-provider suffix is a
        # dangling reference under v3). The v2 docker-network label became traefik.swarm.network
        # for the same reason — the api sits on two overlay networks, so the label is required.
        - "traefik.http.middlewares.sslheaders.headers.customRequestHeaders.X-Forwarded-Proto=https"
        - "traefik.http.middlewares.sslheaders.headers.customResponseHeaders.X-Forwarded-Proto=https"
        - "traefik.http.middlewares.sslheaders.headers.customRequestHeaders.Connection=upgrade"
        # Direct WSS router: rtm.thinx.cloud WebSocket upgrades go straight to the API (bypasses nginx).
        # priority 200 beats the console router so WS upgrades reach the API; sslheaders (no Upgrade strip) preserves the handshake.
        # Reproduces the live thinx-api-ws router so a `docker stack deploy` does not silently drop it.
        # Phase 32 (EDGE-MIG-03, D-08): HeaderRegexp is the v3 name of the v2 matcher (rename only; unanchored, (?i) kept for legacy Upgrade: WebSocket clients).
        - "traefik.http.routers.thinx-api-ws.rule=Host(`rtm.thinx.cloud`) && HeaderRegexp(`Upgrade`, `(?i)websocket`)"
        - "traefik.http.routers.thinx-api-ws.entrypoints=https"
        - "traefik.http.routers.thinx-api-ws.priority=200"
        - "traefik.http.routers.thinx-api-ws.service=thinx-api"
        - "traefik.http.routers.thinx-api-ws.middlewares=sslheaders@swarm"
        - "traefik.http.routers.thinx-api-ws.tls=true"
        - "traefik.http.routers.thinx-api-ws.tls.certresolver=le"

  console:
    depends_on:
      - api
    image: ${REGISTRY}/thinx/console:swarm
    networks:
      - traefik-public
    volumes:
      - /mnt/gluster/deployment/swarm/console/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - "NGINX_PORT=80"
      - "NGINX_HOST=${WEB_HOSTNAME}"
      - "LANDING_HOSTNAME=${LANDING_HOSTNAME}"
      - "WEB_HOSTNAME=${WEB_HOSTNAME}"
      - "API_HOSTNAME=${API_HOSTNAME}"
      - "API_BASEURL=${API_BASEURL}"
      - "APP_HOSTNAME=${APP_HOSTNAME}"
      - "ENTERPRISE=${ENTERPRISE}"
      - "ENVIRONMENT=${ENVIRONMENT}"
      - "GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID}"
      - "ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}"
      - "CRISP_WEBSITE_ID=${CRISP_WEBSITE_ID}"
      - "VUE_APP_CRISP_WEBSITE_ID=${VUE_APP_CRISP_WEBSITE_ID}"
      - "VUE_APP_API_HOSTNAME=${VUE_APP_API_HOSTNAME}"
      - "VUE_APP_ROLLBAR_ACCESS_TOKEN=${VUE_APP_ROLLBAR_ACCESS_TOKEN}"
      - "VUE_APP_LANDING_HOSTNAME=${VUE_APP_LANDING_HOSTNAME}"
      - "VUE_APP_GOOGLE_ANALYTICS_ID=${VUE_APP_GOOGLE_ANALYTICS_ID}"
      - "VUE_APP_GOOGLE_MAPS_APIKEY=${VUE_APP_GOOGLE_MAPS_APIKEY}"
    deploy:
      resources:
        reservations:
          cpus: '0.1'
          memory: 8M
        limits:
          cpus: '0.2'
          memory: 32M
      labels:
        # should be 7440, but the 80 port of container is exposed anyway in swarm mode
        - "traefik.http.services.thinx-console.loadbalancer.server.port=80"
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.constraint-label=traefik-public"

        - "traefik.http.routers.thinx-console-http.rule=Host(`${WEB_HOSTNAME}`)"
        - "traefik.http.routers.thinx-console-http.entrypoints=http"
        - "traefik.http.routers.thinx-console-http.middlewares=https-redirect"

        - "traefik.http.routers.thinx-console-https.rule=Host(`${WEB_HOSTNAME}`)"
        - "traefik.http.routers.thinx-console-https.entrypoints=https"
        - "traefik.http.routers.thinx-console-https.tls=true"
        - "traefik.http.routers.thinx-console-https.tls.certresolver=le"
        - "traefik.http.routers.thinx-console-https.middlewares=security-headers@swarm"

        - swarmpit.service.deployment.autoredeploy=true

        - "traefik.frontend.headers.STSPreload=true"
        - "traefik.frontend.headers.STSSeconds=31536000"

  vue:
    depends_on:
      - api
    image: ${REGISTRY}/thinx/console:vue
    networks:
      - traefik-public
    volumes:
      - /mnt/gluster/deployment/swarm/console/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - "NGINX_PORT=80"
      - "NGINX_HOST=${VUE_HOSTNAME}"
      - "LANDING_HOSTNAME=${LANDING_HOSTNAME}"
      - "WEB_HOSTNAME=${VUE_HOSTNAME}"
      - "API_HOSTNAME=${API_HOSTNAME}"
      - "API_BASEURL=${API_BASEURL}"
      - "APP_HOSTNAME=${APP_HOSTNAME}"
      - "ENTERPRISE=${ENTERPRISE}"
      - "ENVIRONMENT=${ENVIRONMENT}"
      - "GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID}"
      - "ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}"
      - "VUE_APP_ROLLBAR_ACCESS_TOKEN=${VUE_APP_ROLLBAR_ACCESS_TOKEN}"
      - "CRISP_WEBSITE_ID=${CRISP_WEBSITE_ID}"
    deploy:
      resources:
        reservations:
          cpus: '0.1'
          memory: 8M
        limits:
          cpus: '0.2'
          memory: 32M
      labels:
        - "traefik.http.services.thinx-vue-console.loadbalancer.server.port=80"
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.constraint-label=traefik-public"

        - "traefik.http.routers.thinx-vue-console-http.rule=Host(`${VUE_HOSTNAME}`)"
        - "traefik.http.routers.thinx-vue-console-http.entrypoints=http"
        - "traefik.http.routers.thinx-vue-console-http.middlewares=https-redirect"

        - "traefik.http.routers.thinx-vue-console-https.rule=Host(`${VUE_HOSTNAME}`)"
        - "traefik.http.routers.thinx-vue-console-https.entrypoints=https"
        - "traefik.http.routers.thinx-vue-console-https.tls=true"
        - "traefik.http.routers.thinx-vue-console-https.tls.certresolver=le"

        - swarmpit.service.deployment.autoredeploy=true

        - "traefik.frontend.headers.STSPreload=true"
        - "traefik.frontend.headers.STSSeconds=31536000"

  worker:
    image: thinxcloud/worker:latest
    environment:
      - "SQREEN_TOKEN=${SQREEN_TOKEN}"
      - "ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}"
      - "ROLLBAR_ENVIRONMENT=${ROLLBAR_ENVIRONMENT}"
      - "THINX_SERVER=${THINX_SERVER}"
      - "WORKER_SECRET=${WORKER_SECRET}"
      - "THINX_HOSTNAME=${THINX_HOSTNAME}"
      - "COUNTRY=${COUNTRY}" # for sake of service path creation, not really nice
    secrets:
      - WORKER_SECRET
      - ROLLBAR_SERVER_TOKEN
    networks:
      - internal
    labels:
      - traefik.backend.worker.noexpose
    volumes:
      - '/mnt/gluster/thinx:/mnt/data/thinx'
      - '/mnt/gluster/thinx/deploy:/mnt/data/deploy'
      - '/mnt/gluster/thinx/repos:/mnt/data/repos'  
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '/var/lib/docker'
      - '/cache'
    deploy:
      placement:
        constraints:
          - node.hostname == micro
      labels:
        - "swarmpit.service.deployment.autoredeploy=true"

  influxdb:
    image: dhi.io/influxdb:2.9.1
    networks:
      - internal
      - traefik-public
# public is for development only but last deployment shows it has been not found
    volumes:
      - '/mnt/gluster/thinx/influxdb2:/var/lib/influxdb2'
    environment:
      - INFLUXD_BOLT_PATH=/var/lib/influxdb2/influxd.bolt
      - INFLUXD_ENGINE_PATH=/var/lib/influxdb2/engine
      - INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE=256m
      - INFLUXD_STORAGE_MAX_CONCURRENT_COMPACTIONS=1
      - INFLUXD_LOG_LEVEL=error
      - INFLUXD_REPORTING_DISABLED=true
    deploy:
      resources:
        reservations:
          memory: 512M
          cpus: '0.1'
        limits:
          cpus: '0.2'
          memory: 1024M
      labels:
        - "traefik.http.services.thinx-influx.loadbalancer.server.port=8086"
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.constraint-label=traefik-public"

        - "traefik.http.routers.thinx-influx-http.rule=Host(`${INFLUX_HOSTNAME}`)"
        - "traefik.http.routers.thinx-influx-http.entrypoints=http"
        - "traefik.http.routers.thinx-influx-http.middlewares=https-redirect"

        - "traefik.http.routers.thinx-influx-https.rule=Host(`${INFLUX_HOSTNAME}`)"
        - "traefik.http.routers.thinx-influx-https.entrypoints=https"
        - "traefik.http.routers.thinx-influx-https.tls=true"
        - "traefik.http.routers.thinx-influx-https.tls.certresolver=le"

        - swarmpit.service.deployment.autoredeploy=true

        - traefik.http.middlewares.influx-auth.basicauth.users=${USERNAME?Variable not set}:${HASHED_PASSWORD?Variable not set}
        - traefik.http.routers.thinx-influx-https.middlewares=influx-auth,error-pages-middleware
