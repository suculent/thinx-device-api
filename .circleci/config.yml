version: 2.1
orbs:
  node: circleci/node@6.3.0
  docker: circleci/docker@2.0.3
  slack: circleci/slack@5.0.0

commands:

  install-snyk:
    description: >
      Install a pinned Snyk CLI, verify its published SHA-256, and confirm
      SNYK_TOKEN still authenticates against SNYK_ORG_ID before scanning.
    parameters:
      version:
        type: string
        default: v1.1305.0
    steps:
      - run:
          name: Install Snyk CLI << parameters.version >>
          command: |
            cd /tmp
            base="https://downloads.snyk.io/cli/<< parameters.version >>"
            curl -sSL --retry 3 --fail -o snyk-linux        "$base/snyk-linux"
            curl -sSL --retry 3 --fail -o snyk-linux.sha256 "$base/snyk-linux.sha256"
            sha256sum -c snyk-linux.sha256
            chmod +x snyk-linux
            sudo mv snyk-linux /usr/local/bin/snyk
            snyk --version
      - run:
          name: Verify SNYK_TOKEN reaches the target org
          # The scan commands report a bad credential as a bare
          # "Authentication error (SNYK-0005) / 401", which does not say which
          # of several causes applies. This preflight names the actual problem.
          #
          # Service accounts are not available on this plan, so SNYK_TOKEN is a
          # user-owned token and rotation is a question of when, not if.
          command: |
            if [ -z "$SNYK_TOKEN" ]; then
              echo "SNYK_TOKEN is empty. It is provided by the dockerhub context;"
              echo "check that this job declares that context."
              exit 1
            fi

            # Deliberately the endpoint the CLI itself calls during a scan.
            # GET /rest/orgs/{id} is NOT usable here: a Snyk API token gets 403
            # from it even for an org the token's own account owns, so checking
            # against it would reject working credentials. Verified that this
            # endpoint still returns 401 for a garbage, empty or absent token,
            # so it rejects what it should.
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: token $SNYK_TOKEN" \
              "https://api.snyk.io/v1/cli-config/feature-flags/snykCodeCli?org=$SNYK_ORG_ID")

            case "$code" in
              200)
                echo "SNYK_TOKEN authenticates against org $SNYK_ORG_ID."
                ;;
              401)
                echo "SNYK_TOKEN was rejected (401 Unauthorized)."
                echo
                echo "The token is not recognised: either it was revoked, or it is a"
                echo "Personal Access Token that has passed its expiry date."
                echo "Reissue at https://app.snyk.io/account, then replace SNYK_TOKEN"
                echo "in the CircleCI 'dockerhub' context."
                echo
                echo "An OAuth session JWT copied from 'snyk config' will NOT work"
                echo "here: it is scoped org.read and cannot create projects."
                exit 1
                ;;
              403|404)
                echo "SNYK_TOKEN authenticates but cannot reach org $SNYK_ORG_ID (HTTP $code)."
                echo "Confirm the token's account is a member of the thinx-cloud org."
                exit 1
                ;;
              *)
                echo "Unexpected HTTP $code from the Snyk API while checking the token."
                exit 1
                ;;
            esac

jobs:

  build-base:
    executor: docker/docker
    steps:
      - setup_remote_docker:
          version: previous
      - checkout
      - docker/check
      - run:
          name: Clean up artifacts
          command: |
            cd base && rm -rf ./node_modules
      - docker/build:
          docker-context: base
          image: thinxcloud/base
          dockerfile: ./base/Dockerfile
          extra_build_args: '--build-arg REVISION=$(git describe --abbrev=0)'
          tag: latest
      - docker/push:
          digest-path: /tmp/digest.txt
          image: thinxcloud/base
          tag: latest

  build-vue-console:
    executor: docker/docker
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Plan a deploy
          command: |
            circleci run release plan thinx-console-vue \
              --environment-name="production" \
              --component-name="thinx-console-vue" \
              --target-version="$CIRCLE_SHA1"
      - run:
          name: "Check Required Environment Variables"
          command: |
            required_vars=(
              API_BASEURL API_HOSTNAME APP_HOSTNAME ROLLBAR_ACCESS_TOKEN 
              LANDING_HOSTNAME GOOGLE_ANALYTICS_ID CRISP_WEBSITE_ID ENTERPRISE 
              ENVIRONMENT VUE_APP_API_HOSTNAME GOOGLE_MAPS_APIKEY
              VUE_APP_ROLLBAR_ACCESS_TOKEN VUE_APP_LANDING_HOSTNAME 
              WEB_HOSTNAME
            )

            for var in "${required_vars[@]}"; do
              if [ -z "${!var}" ]; then
                echo "Environment variable $var is missing or empty."
                exit 1
              fi
            done

            echo "All required environment variables are present."
      - run:
          name: Fetch all dependencies (esp. console)
          command: |
            git submodule foreach --recursive 'git submodule sync' && git submodule update --init --recursive
      - docker/check:
          registry: registry.thinx.cloud:5000
      - docker/build:
          registry: registry.thinx.cloud:5000
          docker-context: services/console/vue
          image: thinx/console
          dockerfile: services/console/vue/Dockerfile
          extra_build_args: --build-arg ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN} --build-arg LANDING_HOSTNAME=${LANDING_HOSTNAME} --build-arg API_HOSTNAME=${API_HOSTNAME} --build-arg API_BASEURL=${API_BASEURL} --build-arg WEB_HOSTNAME=${WEB_HOSTNAME} --build-arg GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID} --build-arg CRISP_WEBSITE_ID=${CRISP_WEBSITE_ID} --build-arg ENTERPRISE=${ENTERPRISE} --build-arg ENVIRONMENT=${ENVIRONMENT} --build-arg COMMIT_ID=$CIRCLE_SHA1 --build-arg VERSION_CODE=$(echo $CIRCLE_SHA1 | cut -c -7) --build-arg VUE_APP_CRISP_WEBSITE_ID=${CRISP_WEBSITE_ID} --build-arg VUE_APP_API_HOSTNAME=${VUE_APP_API_HOSTNAME} --build-arg VUE_APP_ROLLBAR_ACCESS_TOKEN=${VUE_APP_ROLLBAR_ACCESS_TOKEN} --build-arg VUE_APP_LANDING_HOSTNAME=${VUE_APP_LANDING_HOSTNAME} --build-arg VUE_APP_GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID} --build-arg VUE_APP_GOOGLE_MAPS_APIKEY=${GOOGLE_MAPS_APIKEY} --build-arg VUE_APP_CONSOLE_HOSTNAME=${WEB_HOSTNAME} --build-arg VUE_APP_BUILD_HASH=$(echo $CIRCLE_SHA1 | cut -c -7)
          tag: 'vue'
      - docker/push:
          digest-path: /tmp/digest.txt
          image: thinx/console
          registry: registry.thinx.cloud:5000
          tag: 'vue'
      - run:
          name: Mark deploy SUCCESS
          command: circleci run release update thinx-console-vue --status=SUCCESS
          when: on_success
      - run:
          name: Mark deploy FAILED
          command: circleci run release update thinx-console-vue --status=FAILED
          when: on_fail

  build-console-classic:
    executor: docker/docker
    steps:
      - setup_remote_docker:
          version: 20.10.24
      - checkout
      - run:
          name: Plan a deploy
          command: |
            circleci run release plan thinx-console-classic \
              --environment-name="production" \
              --component-name="thinx-console-classic" \
              --target-version="$CIRCLE_SHA1"
      - run:
          name: Fetch all dependencies (esp. console)
          command: |
            git submodule foreach --recursive 'git submodule sync' && git submodule update --init --recursive
      - docker/check:
          registry: registry.thinx.cloud:5000
      - docker/build:
          registry: registry.thinx.cloud:5000
          docker-context: services/console/src
          image: thinx/console
          dockerfile: services/console/src/Dockerfile
          extra_build_args: --build-arg ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN} --build-arg LANDING_HOSTNAME=${LANDING_HOSTNAME} --build-arg API_HOSTNAME=${API_HOSTNAME} --build-arg API_BASEURL=${API_BASEURL} --build-arg WEB_HOSTNAME=${WEB_HOSTNAME} --build-arg GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID} --build-arg CRISP_WEBSITE_ID=${CRISP_WEBSITE_ID} --build-arg ENTERPRISE=${ENTERPRISE} --build-arg ENVIRONMENT=${ENVIRONMENT} --build-arg COMMIT_ID=$CIRCLE_SHA1 --build-arg VERSION_CODE=$(echo $CIRCLE_SHA1 | cut -c -7)
          tag: 'swarm'
      - docker/push:
          digest-path: /tmp/digest.txt
          image: thinx/console
          registry: registry.thinx.cloud:5000
          tag: 'swarm'
      - run:
          name: Mark deploy SUCCESS
          command: circleci run release update thinx-console-classic --status=SUCCESS
          when: on_success
      - run:
          name: Mark deploy FAILED
          command: circleci run release update thinx-console-classic --status=FAILED
          when: on_fail

  build-api-cloud:
    executor: docker/docker
    steps:
      - setup_remote_docker:
          version: previous
          docker_layer_caching: true
      - checkout
      - run:
          name: Plan a deploy
          command: |
            circleci run release plan thinx-api \
              --environment-name="production" \
              --component-name="thinx-api" \
              --target-version="$CIRCLE_SHA1"
      - run:
          name: Clean package-lock
          command: |
            rm -rf ./package-lock.json
      - docker/check
      - docker/build:
          image: thinxcloud/api
          dockerfile: ./Dockerfile
          extra_build_args: --build-arg AQUA_SEC_TOKEN=${AQUA_SEC_TOKEN} --build-arg SNYK_TOKEN=${SNYK_TOKEN} --build-arg ENVIRONMENT=${ENVIRONMENT} --build-arg REVISION=$(git describe --abbrev=0) --build-arg COMMIT_SHA=$CIRCLE_SHA1 --build-arg ENTERPRISE=${ENTERPRISE}
          tag: 'latest'
      - docker/push:
          digest-path: /tmp/digest.txt
          image: thinxcloud/api
          tag: 'latest'
      # Pass-notification removed (was misleading — fires before the swarm
      # actually pulls the new image). App-start Slack notification is now
      # sent from inside the API at init time via Notifier.notifyAppStart()
      # in thinx.js (see lib/thinx/notifier.js).
      - slack/notify:
          template: basic_fail_1
          event: fail
      - run:
          name: Mark deploy SUCCESS
          command: circleci run release update thinx-api --status=SUCCESS
          when: on_success
      - run:
          name: Mark deploy FAILED
          command: circleci run release update thinx-api --status=FAILED
          when: on_fail

  aikido-image-scan:
    machine:
      image: ubuntu-2204:current
    steps:
      - run:
          name: Pull thinxcloud/api image
          command: docker pull thinxcloud/api:latest
      - run:
          name: Run Aikido scan
          command: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aikidosecurity/local-scanner image-scan thinxcloud/api:latest --apikey "$AIKIDO_TOKEN"

  #
  # Snyk monitoring. Code (SAST), Open Source (SCA) and Containers all report
  # into the thinx-cloud Snyk org (43fbd00a-...), so code review, component
  # analysis and images appear together in the Snyk UI.
  #
  # A workstation's default org may differ, so every command passes --org.
  # SNYK_TOKEN must be present in the job context (already used as a build arg
  # by build-api-cloud).
  #

  snyk-code-monitor:
    docker:
      - image: cimg/node:lts
    environment:
      SNYK_ORG_ID: 43fbd00a-d74b-4561-98a3-65e6e42bc094
      # This repo's git remote is suculent/thinx-device-api. Pinning the target
      # URL keeps Code and Open Source projects under one target in the UI;
      # change this single line if the repo moves to the thinx-cloud GitHub org.
      SNYK_REMOTE_REPO_URL: https://github.com/suculent/thinx-device-api
    steps:
      - checkout
      - run:
          name: Fetch all dependencies (esp. console)
          command: |
            git submodule foreach --recursive 'git submodule sync' && git submodule update --init --recursive
      - install-snyk
      - run:
          name: Snyk Code (SAST) into Snyk UI
          command: |
            set +e
            snyk code test \
              --report \
              --org="$SNYK_ORG_ID" \
              --remote-repo-url="$SNYK_REMOTE_REPO_URL" \
              --project-name=thinx-device-api \
              --target-name=thinx-device-api \
              --target-reference="$CIRCLE_BRANCH"
            rc=$?
            set -e
            # 0 = clean, 1 = issues found (results are still uploaded),
            # 2 = CLI/auth error, 3 = nothing scannable. Only 2 and 3 are failures.
            if [ "$rc" -gt 1 ]; then exit "$rc"; fi

  snyk-oss-monitor:
    docker:
      - image: cimg/node:lts
    environment:
      SNYK_ORG_ID: 43fbd00a-d74b-4561-98a3-65e6e42bc094
      SNYK_REMOTE_REPO_URL: https://github.com/suculent/thinx-device-api
    steps:
      - checkout
      - run:
          name: Fetch all dependencies (esp. console)
          command: |
            git submodule foreach --recursive 'git submodule sync' && git submodule update --init --recursive
      - run:
          name: Generate the lockfiles snyk monitor needs
          # Only the root package-lock.json is committed; the rest are caught by
          # a global gitignore rule. Without a lockfile (or a populated
          # node_modules) --all-projects silently SKIPS a project, which would
          # otherwise leave 5 of the 6 apps unscanned.
          #
          # These lockfiles are resolved fresh here, so versions can drift from
          # what a published image actually installed. The container monitors
          # are the authoritative view of deployed dependencies.
          command: |
            for dir in . base services/transformer services/worker \
                       services/console/src services/console/vue; do
              if [ ! -f "$dir/package.json" ]; then
                echo "no package.json in $dir, skipping"
                continue
              fi
              if [ -f "$dir/package-lock.json" ]; then
                echo "lockfile already present in $dir"
                continue
              fi
              echo "generating lockfile for $dir"
              # services/console/vue has an apexcharts/vue-apexcharts peer
              # conflict and its Dockerfile installs with --legacy-peer-deps,
              # so fall back to the same resolution the image build uses.
              if ! ( cd "$dir" && npm install --package-lock-only --ignore-scripts ); then
                echo "retrying $dir with --legacy-peer-deps"
                ( cd "$dir" && npm install --package-lock-only --ignore-scripts --legacy-peer-deps )
              fi
            done
      - install-snyk
      - run:
          name: Snyk Open Source (SCA) into Snyk UI
          # `monitor` records the dependency graph and exits 0 even when
          # vulnerabilities are found, so no exit-code handling is needed here.
          command: |
            snyk monitor \
              --all-projects \
              --detection-depth=6 \
              --exclude=spec,test_repositories \
              --org="$SNYK_ORG_ID" \
              --remote-repo-url="$SNYK_REMOTE_REPO_URL" \
              --target-reference="$CIRCLE_BRANCH"

  snyk-container-monitor:
    parameters:
      image:
        type: string
      tag:
        type: string
        default: latest
      registry:
        type: string
        default: docker.io
      dockerfile:
        description: Dockerfile to associate, enabling base-image upgrade advice.
        type: string
        default: ''
      submodules:
        description: Set when the Dockerfile lives inside a submodule.
        type: boolean
        default: false
    machine:
      image: ubuntu-2204:current
    environment:
      SNYK_ORG_ID: 43fbd00a-d74b-4561-98a3-65e6e42bc094
    steps:
      - checkout
      - when:
          condition: << parameters.submodules >>
          steps:
            - run:
                name: Fetch all dependencies (esp. console)
                command: |
                  git submodule foreach --recursive 'git submodule sync' && git submodule update --init --recursive
      - docker/check:
          registry: << parameters.registry >>
      - install-snyk
      - run:
          name: Monitor << parameters.image >>:<< parameters.tag >>
          # `container monitor` has no --remote-repo-url, so container projects
          # group by image rather than under the git target. They still land in
          # the same thinx-cloud org as Code and Open Source.
          command: |
            PROJECT="<< parameters.image >>:<< parameters.tag >>"
            IMAGE="$PROJECT"
            if [ "<< parameters.registry >>" != "docker.io" ]; then
              IMAGE="<< parameters.registry >>/$PROJECT"
            fi

            FILE_ARG=""
            if [ -n "<< parameters.dockerfile >>" ]; then
              FILE_ARG="--file=<< parameters.dockerfile >>"
            fi

            docker pull "$IMAGE"
            snyk container monitor "$IMAGE" \
              --org="$SNYK_ORG_ID" \
              --project-name="$PROJECT" \
              --target-reference="$CIRCLE_BRANCH" \
              $FILE_ARG

  test:

    docker:
      - image: thinxcloud/base:latest
        auth:
          username: $DOCKER_USERNAME  # from thinx-docker-repo, docker.io
          password: $DOCKER_PUBLIC_PASSWORD  # or project environment variable reference
    
    # because the tests do not consume much of RAM or CPU, this probably won't cause any more slowdown
    resource_class: large

    working_directory: ~/suculent/thinx-device-api

    parallelism: 1

    shell: /bin/sh --login

    environment:
      CIRCLE_ARTIFACTS: /tmp/circleci-artifacts
      CIRCLE_TEST_REPORTS: /tmp/circleci-test-results
      REDIS_URL: redis://localhost:6379

    steps:

    - restore_cache:
        keys:
          - v1-docker-compose-v2.4.1

    - run:
        name: Install Docker Compose
        command: |
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          if [ ! -f "$DOCKER_CONFIG/cli-plugins/docker-compose" ]; then
            curl -SL https://github.com/docker/compose/releases/download/v2.4.1/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
            chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
          fi
          docker compose version

    - save_cache:
        paths:
          - ~/.docker/cli-plugins/docker-compose
        key: v1-docker-compose-v2.4.1

    - setup_remote_docker:
          version: previous
          docker_layer_caching: true

    - checkout

    - run:
        name: Fetch all submodules and tests
        command: |
          rm -rf ./package-lock.json
          git submodule foreach --recursive 'git submodule sync' && git submodule update --init --recursive
          cd spec/test_repositories
          pwd
          sh ./get-tests.sh

    - run:
        name: Create Circle CI Artifacts Folders
        command: |
          mkdir -p $CIRCLE_ARTIFACTS $CIRCLE_TEST_REPORTS
          mkdir -p $CIRCLE_TEST_REPORTS/reports

    - run:
        name: Init filesystem
        command: |
            mkdir -p /mnt/data/
            mkdir -p /mnt/data && cp -R ./conf /mnt/data
            mkdir -p /mnt/data/ssh_keys && cp -R ./spec/mnt/data/ssh_keys /mnt/data
            mkdir -p /mnt/data/mosquitto/auth
            mkdir -p /mnt/data/mosquitto/config
            mkdir -p /mnt/data/mosquitto/data
            mkdir -p /mnt/data/mosquitto/log
            mkdir -p /mnt/data/mosquitto/ssl
            mkdir -p /mnt/data/couchdb
            mkdir -p /mnt/data/deploy
            mkdir -p /mnt/data/data
            mkdir -p /mnt/data/redis
            mkdir -p /mnt/data/repos
            mkdir -p /mnt/data/ssl
            mkdir -p /mnt/data/test-reports

    - run:
        name: Switch to Test Dockerfiles
        command: |
          rm -rf ./Dockerfile
          mv ./Dockerfile.test ./Dockerfile
          rm -rf ./docker-compose.yml
          mv ./docker-compose.test.yml ./docker-compose.yml
          rm -rf ./services/broker/Dockerfile
          mv ./services/broker/Dockerfile.test ./services/broker/Dockerfile
          sed -i "s/.git//g" .dockerignore

    - run:
        name: Copy Environment variables for in-place building
        command: |
          cp -vf ./.env.dist ./.env
          cp -vf ./.env.dist ./spec/mnt/data/conf/.env
          cp -vf ./.env ./services/broker/.env
          cp -vf ./.env ./services/console/.env
          cp -vf ./.env ./services/couchdb/.env
          cp -vf ./.env ./services/redis/.env
          cp -vf ./.env ./services/transformer/.env

    - run:
        name: Review configuration and environment
        command: |
          echo "Contents of ./conf"
          ls -la ./conf
          echo "Contents of ./.env"
          cat ./.env

    - run:
        name: Inject password to configuration and broker
        command: |
          echo "Injecting secret: ${REDIS_PASSWORD}"
          sed -i "s/changeme!/${REDIS_PASSWORD}/g" ./services/broker/test/mosquitto/mosquitto.conf
          cp ./spec/mnt/data/conf/config.json /mnt/data/conf/config.json

    - run:
        name: Mock self-signed CA and SSL certificates
        command: |
          cd spec/mnt/data/ssl
          apk add --no-cache bash ca-certificates openssl
          ./_generate-ca-root-csr-and-sign-cert.sh
          cp ./testRoot.crt /usr/local/share/ca-certificates
          update-ca-certificates


    - run:
        name: Starting Influx
        command: |
          PUB=$(docker network inspect traefik-public)
          if [ "$PUB" == '[]' ]; then docker network create traefik-public; fi
          NAT=$(docker network inspect nat)
          if [ "$NAT" == '[]' ]; then docker network create nat ; fi
          docker compose up -d influxdb
          docker compose logs influxdb

    - run:
        name: Starting Redis
        command: |
          docker compose up -d thinx-redis
          docker compose logs thinx-redis

    - run:
        name: Starting Support Services
        command: |
          export ENVIRONMENT=test
          chmod -R 666 ./services/couchdb/*
          docker login --username $DOCKER_LOGIN --password $DOCKER_PASSWORD https://registry.thinx.cloud:5000
          docker compose up -d mosquitto transformer worker couchdb

    - run:
        name: Running Unit and Integration Tests 
        command: |
          export ENVIRONMENT=test
          pwd
          docker compose up --build api | tee -ia ./test.log
          echo "Docker test complete."
          # POSIX test, not bash: this step runs under `shell: /bin/sh --login`,
          # where `[[` is not a builtin. The old `if [[ ! $(grep ...) ]]` errored
          # with "sh: |: unknown operand" instead of evaluating, so `exit 1` was
          # unreachable and a failing suite could still report success.
          if ! grep -q "specs, 0 failures" ./test.log; then
            echo "» TEST failed. Should not deploy this commit."
            grep "Failures:" ./test.log || true
            exit 1
          fi

    - run:
        # The tests run inside the compose `api` container on the remote Docker
        # host (setup_remote_docker), so a bind mount of ./coverage would land on
        # that host, not in this job's workspace. `docker cp` streams the files
        # back through the Docker API instead, which works with remote Docker.
        name: Collect coverage from test container
        when: always
        command: |
          mkdir -p ./coverage
          CID=$(docker ps -aq --filter label=com.docker.compose.service=api | head -n 1)
          if [ -z "$CID" ]; then
            echo "No api container found; nothing to collect."
            exit 0
          fi
          docker cp "$CID:/opt/thinx/thinx-device-api/coverage/." ./coverage/ || echo "No coverage directory in container."
          ls -la ./coverage

    - run:
        name: Check running Docker containers
        command: |
            docker ps
            docker network ls
            docker network inspect bridge
            docker compose stop

    - store_test_results:
        name: Collect test data
        path: /mnt/data
        # The `path` key is an absolute or relative path to your working_directory containing 
        # subdirectories of JUnit XML or Cucumber JSON test metadata files,
        # or the path of a single file containing all test results.
        # Make sure that your path value is not a hidden folder (example: .my_hidden_directory would be an invalid format).

    - store_artifacts:
        name: Collect coverage data
        path: ./coverage
        destination: coverage

#
# WORKFLOWS
#

workflows:

  #
  # public open-source site
  #

  main:

    jobs:

      - test:
          context:
              - dockerhub
              - thinx-docker-repo
              - thinx-test
              - sonarcloud
          #requires:
          #  - build-base
          filters:
            branches:
              only:
                - base
                - thinx-unit
                - thinx-class
                - thinx-staging
                - main
      
      - build-console-classic:
          context:
            - thinx-docker-repo
            - console
          filters:
            branches:
              only:
                - thinx-staging
                - main

      - build-vue-console:
          context:
            - dockerhub
            - thinx-docker-repo
            - console
          filters:
            branches:
              only:
                - thinx-console
                - thinx-staging
                - main

      - build-base:
          context:
            - dockerhub
          filters:
            branches:
              only:
                - base

      - build-api-cloud:
          context:
            - dockerhub
            - SonarCloud
            - thinx-slack
          requires:
            - test
          filters:
            branches:
              only:
                - thinx-staging
                - main

      # Disabled: Aikido local image scanning is not available on the free plan.
      # Re-enable by uncommenting once the account supports it.
      # - aikido-image-scan:
      #     requires:
      #       - build-api-cloud
      #     filters:
      #       branches:
      #         only:
      #           - thinx-staging
      #           - main

      #
      # Snyk: code review (SAST), component analysis (SCA) and container images,
      # all reported into the thinx-cloud Snyk org.
      #
      # Each container monitor mirrors the filters of the job that builds its
      # image. A single job requiring all four builds would never run, because
      # build-base is `base`-only while the others are staging/main.
      #

      - snyk-code-monitor:
          context:
            - dockerhub
          filters:
            branches:
              only:
                # TEMPORARY: smoke-tests the Snyk wiring without triggering any
                # build, image push or deploy record. Remove before merging.
                - ci/snyk-monitoring
                - thinx-staging
                - main

      - snyk-oss-monitor:
          context:
            - dockerhub
          filters:
            branches:
              only:
                # TEMPORARY: smoke-tests the Snyk wiring without triggering any
                # build, image push or deploy record. Remove before merging.
                - ci/snyk-monitoring
                - thinx-staging
                - main

      - snyk-container-monitor:
          name: snyk-monitor-api
          image: thinxcloud/api
          tag: latest
          dockerfile: ./Dockerfile
          context:
            - dockerhub
          requires:
            - build-api-cloud
          filters:
            branches:
              only:
                - thinx-staging
                - main

      - snyk-container-monitor:
          name: snyk-monitor-base
          image: thinxcloud/base
          tag: latest
          dockerfile: ./base/Dockerfile
          context:
            - dockerhub
          requires:
            - build-base
          filters:
            branches:
              only:
                - base

      - snyk-container-monitor:
          name: snyk-monitor-console-classic
          image: thinx/console
          tag: swarm
          registry: registry.thinx.cloud:5000
          dockerfile: services/console/src/Dockerfile
          submodules: true
          context:
            - thinx-docker-repo
            - console
          requires:
            - build-console-classic
          filters:
            branches:
              only:
                - thinx-staging
                - main

      - snyk-container-monitor:
          name: snyk-monitor-console-vue
          image: thinx/console
          tag: vue
          registry: registry.thinx.cloud:5000
          dockerfile: services/console/vue/Dockerfile
          submodules: true
          context:
            - dockerhub
            - thinx-docker-repo
            - console
          requires:
            - build-vue-console
          filters:
            branches:
              only:
                - thinx-console
                - thinx-staging
                - main
