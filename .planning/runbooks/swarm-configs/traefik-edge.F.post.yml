# ---------------------------------------------------------------------------
# Dynamic config — docker config tls-config-3, mounted at /traefik/tls.toml and LOADED by the file provider.
# Byte-identical to committed thinx-swarm/traefik/tls.toml (sha256 45d010483d0e1d50…; zero drift, re-read 16:36Z).
tls_toml: |
  # Phase 33 (EDGE-TLS-01, D-13..D-16): loaded by --providers.file.filename=/traefik/tls.toml
  # as docker config tls-config-${CONFIG} (swarm configs are immutable: bump CONFIG, create the new
  # config FROM the micro checkout, then `docker service update --config-rm/--config-add`; one task restart).
  # `default` applies to every TLS router (no per-router tls.options labels needed).
  # TLS 1.3 suites are fixed by Go. The ALPN protocol list is left at its default (h2, http/1.1, acme-tls/1)
  # because the TLS-ALPN resolver depends on acme-tls/1; the deprecated server-cipher-preference key is
  # ineffective in Go and omitted. No maximum-version key: TLS 1.3 stays offered and preferred (D-15).
  # Phase 34 (D-15, 33-REVIEW WR-03): this file also defines the security-headers middleware for the file provider;
  # it is the https entrypoint default (security-headers@file), so no swarm label update can remove it from the edge.
  # Phase 34 (D-15): no curve list — Go's default set incl. the X25519MLKEM768 post-quantum hybrid is offered again;
  # strict SNI stays off (no evidence about no-SNI legacy clients; the ingress NAT hides who they are).
  [tls]
    [tls.options]
      [tls.options.default]
        minVersion = "VersionTLS12"
        sniStrict = false
        cipherSuites = [
          "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
          "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
          "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
          "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
          "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305",
          "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
        ]

  [http]
    [http.middlewares]
      [http.middlewares.security-headers.headers]
        browserXssFilter = true
        contentTypeNosniff = true
        forceSTSHeader = true
        frameDeny = true
        stsIncludeSubdomains = true
        stsPreload = true
        stsSeconds = 31536000

