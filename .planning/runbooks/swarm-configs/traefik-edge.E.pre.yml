traefik_service:
  image: traefik:v3.7.14
  # resolved on micro: image id sha256:5a93040e5abdf181145d7c242964eca7999ffd700e0447b242ef212f3ee44d55 — UNCHANGED vs D.post.yml
  # (RepoDigests on micro: traefik@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c and
  # traefik@sha256:e849695bc5c317da0cec22bfee4794fd9e15871fe554f864d31b625983e883ff; same image id).
  # Version.Index 38379738 (Phase 32 Stage 2, settled); Spec.UpdatedAt 2026-10-08T14:48:31Z; UpdateStatus completed;
  # PreviousSpec: traefik:v3.7.14 with 17 Args (the pre-Phase-32-Stage-2 spec). Service created 2026-03-28.
  # task traefik_traefik.1 yudql1hqdnd9 on micro, container 35bfaaa9a179 started 2026-10-08T14:48:25Z (Running 8 h at capture).
  # Published host ports — the traefik service itself publishes ONLY 80 and 443 (ingress). UNCHANGED.
  published_ports:
    - 80:80/tcp     # entrypoint http
    - 443:443/tcp   # entrypoint https
  # Resolved static command (Spec.TaskTemplate.ContainerSpec.Args), in live order — the 16-flag native-v3 set, index-exact
  # against the committed thinx-swarm/traefik.yml@158f369 / docker-compose.traefik.yml (16 `- --` lines each, email masked).
  # Phase 33 adds --entrypoints.mgmt.address=127.0.0.1:8080 (Stage A1, appended at the END of the live Args — nothing reads
  # Args by index, RESEARCH A5) and flips exposedbydefault to false (Stage B); Stages C/D (Plan 02) add two more flags.
  command:
    - --providers.swarm                                   # v3 split provider (P31)
    - --providers.swarm.constraints=Label(`traefik.constraint-label`, `traefik-public`)   # value byte-identical, backticks intact
    - --providers.swarm.exposedbydefault=true             # WART -> Phase 33 Stage B flips the value to false (D-07)
    - --entrypoints.http.address=:80
    - --entrypoints.https.address=:443
    - --entrypoints.vpn.address=:1194                     # vestigial: defined, NO router, NOT published by traefik
    - --entrypoints.mqtt.address=:1883                    # vestigial: :1883 published directly by thinx_mosquitto
    - --entrypoints.mqtts.address=:8883                   # vestigial: traefik does NOT publish :8883
    - --entrypoints.thxp.address=:7442                    # vestigial: :7442 published directly by thinx_api (AGENTS.md keep-7442)
    - --certificatesresolvers.le.acme.email=${EMAIL}      # live resolves to a real operator address; kept templated in git (P29 D-12)
    - --certificatesresolvers.le.acme.storage=/certificates/acme.json
    - --certificatesresolvers.le.acme.tlschallenge=true
    - --accesslog
    - --log
    - --log.level=ERROR                                   # WART -> fix-forward P34 (policy choice)
    - --api                                               # WART -> Phase 33 Stage A: dashboard/API moved to the loopback mgmt entrypoint; NO --api.insecure live (0 Args match api.insecure|providers.docker)
  mounts:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      read_only: true                                     # ro raw docker.sock -> fix-forward P34 (socket-proxy); default swarm endpoint
    - type: volume
      source: traefik_traefik-public-certificates         # swarm-namespaced; committed file names it traefik-public-certificates
      target: /certificates                               # acme.json: 24 certs (see acme_json below)
  configs:
    - config_name: tls-config-1                           # committed: name tls-config-${CONFIG:-1}, so CONFIG=1 live; NEVER loaded (no --providers.file) — Plan 02 Stage C swaps in tls-config-2
      target: /traefik/tls.toml
      mode: "0444"                                        # sha256 7e43d8f919317184f5ccbb684bf5c654dad614567eb80ffe04d875ec4169e35a == committed thinx-swarm/traefik/tls.toml (zero drift, re-read 22:44Z)
  networks:
    - traefik-public                                      # yw26fv3f…; alias: traefik; external network
  placement:
    - node.labels.Traefik == true                         # only micro carries the label
  env: []                                                 # ContainerSpec.Env is null live (all values are flags/labels)
  # Resolved deploy labels on the traefik service itself (basic-auth hash redacted; DOMAIN/USERNAME templated). UNCHANGED since Phase 31.
  # Phase 33 Stage A2 removes admin-auth + both traefik-public-* routers (10 keys) and adds the three traefik-mgmt router keys;
  # the traefik-public service port label is LOAD-BEARING and stays (RESEARCH Pitfall 1 — the v3 swarm provider skips a
  # traefik-enabled service without a port, dropping https-redirect@swarm / security-headers@swarm for every router).
  labels:
    traefik.enable: "true"
    traefik.swarm.network: traefik-public                # v3 swarm-provider key (P31)
    traefik.constraint-label: traefik-public
    traefik.http.middlewares.admin-auth.basicauth.users: ${USERNAME}:<redacted>   # apr1 hash redacted (P29 D-12); REMOVED by Stage A2
    traefik.http.middlewares.https-redirect.redirectscheme.scheme: https
    traefik.http.middlewares.https-redirect.redirectscheme.permanent: "true"
    traefik.http.middlewares.security-headers.headers.browserxssfilter: "true"
    traefik.http.middlewares.security-headers.headers.contenttypenosniff: "true"
    traefik.http.middlewares.security-headers.headers.forcestsheader: "true"
    traefik.http.middlewares.security-headers.headers.framedeny: "true"
    traefik.http.middlewares.security-headers.headers.stsincludesubdomains: "true"
    traefik.http.middlewares.security-headers.headers.stspreload: "true"
    traefik.http.middlewares.security-headers.headers.stsseconds: "31536000"
    traefik.http.middlewares.error-pages-middleware.errors.status: 400-599
    traefik.http.middlewares.error-pages-middleware.errors.service: errorpage
    traefik.http.middlewares.error-pages-middleware.errors.query: /{status}.html
    traefik.http.routers.traefik-public-http.rule: Host(`${DOMAIN}`)             # REMOVED by Stage A2
    traefik.http.routers.traefik-public-http.entrypoints: http                   # REMOVED by Stage A2
    traefik.http.routers.traefik-public-http.middlewares: https-redirect         # REMOVED by Stage A2
    traefik.http.routers.traefik-public-https.rule: Host(`${DOMAIN}`)            # REMOVED by Stage A2
    traefik.http.routers.traefik-public-https.entrypoints: https                 # REMOVED by Stage A2
    traefik.http.routers.traefik-public-https.tls: "true"                        # REMOVED by Stage A2
    traefik.http.routers.traefik-public-https.service: api@internal              # REMOVED by Stage A2 (re-declared as traefik-mgmt on the mgmt entrypoint)
    traefik.http.routers.traefik-public-https.tls.certresolver: le               # REMOVED by Stage A2
    traefik.http.routers.traefik-public-https.middlewares: admin-auth,error-pages-middleware   # REMOVED by Stage A2
    traefik.http.services.traefik-public.loadbalancer.server.port: "8080"      # LOAD-BEARING — KEPT (research amendment to D-01)
  # Stack bookkeeping labels (not read by Traefik): com.docker.stack.namespace=traefik and
  # com.docker.stack.image=traefik:v2.11@sha256:d57faa4f… — the latter is STALE (only `docker stack deploy` rewrites
  # it; `docker service update --image` / `--args` do not). Cosmetic; pre-existing; NOT touched by Phase 33.

# ---------------------------------------------------------------------------
# Dynamic config — docker config tls-config-1, mounted at /traefik/tls.toml, NEVER loaded (32-REVIEW IN-01).
# Byte-identical to committed thinx-swarm/traefik/tls.toml (sha256 7e43d8f919317184…; zero drift; untouched by Phase 32).
# Phase 33 Plan 02 Stage C replaces it with tls-config-2 (AEAD-only default TLS option) and adds --providers.file.filename.
tls_toml: |
  [tls]
    [tls.options]
      [tls.options.default]
        minVersion = "VersionTLS12"
        sniStrict = true
        cipherSuites = [
          "TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256",
          "TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256",
          "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
          "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
          "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
          "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
          "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305",
          "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305",
          "TLS_AES_128_GCM_SHA256",
          "TLS_AES_256_GCM_SHA384",
          "TLS_CHACHA20_POLY1305_SHA256"
        ]

