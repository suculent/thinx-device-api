# Dynamic config — docker config tls-config-2, mounted at /traefik/tls.toml and LOADED by the file provider (Stage C).
# Byte-identical to committed thinx-swarm/traefik/tls.toml@94da01c..c03c529 (sha256 bb0cba95ea22e973…; zero drift).
# Proof on the wire (the v3.7.14 API does not expose TLS options — 33-02 deferred item): rtm/app/console negotiate TLS 1.2
# (ECDHE-RSA-AES128-GCM-SHA256) and TLS 1.3 (TLS_AES_128_GCM_SHA256) with verify 0, refuse TLS 1.1, refuse the CBC suite
# ECDHE-RSA-AES128-SHA (handshake failure x3) and refuse P-384 (handshake failure x3); nmap TLS 1.2 set == the three
# ECDHE_RSA AEAD suites on all 17 hosts, TLSv1.3 on ecdh_x25519, no SSLv3/TLSv1.0/TLSv1.1 sections, least strength A.
tls_toml: |
  # Phase 33 (EDGE-TLS-01, D-13..D-16): loaded by --providers.file.filename=/traefik/tls.toml
  # as docker config tls-config-${CONFIG} (swarm configs are immutable: bump CONFIG, create the new
  # config FROM the micro checkout, then `docker service update --config-rm/--config-add`; one task restart).
  # `default` applies to every TLS router (no per-router tls.options labels needed).
  # TLS 1.3 suites are fixed by Go. The ALPN protocol list is left at its default (h2, http/1.1, acme-tls/1)
  # because the TLS-ALPN resolver depends on acme-tls/1; the deprecated server-cipher-preference key is
  # ineffective in Go and omitted. No maximum-version key: TLS 1.3 stays offered and preferred (D-15).
  [tls]
    [tls.options]
      [tls.options.default]
        minVersion = "VersionTLS12"
        sniStrict = false
        curvePreferences = ["X25519", "CurveP256"]
        cipherSuites = [
          "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
          "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
          "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
          "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
          "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305",
          "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
        ]

