# App-stack router labels that Phase 32 converted (the four formerly v2-only rules of the 2026-10-08 live inventory),
# as resolved live on 2026-10-08 15:12 UTC via `docker service inspect <svc>` (.Spec.Labels) and the
# credentialed /api/http/routers readback (every one enabled; ruleSyntax field absent = inherited v3 default):
app_stack_labels_post_phase32:
  thinx_api:
    traefik.http.routers.thinx-api-ws.rule: Host(`rtm.thinx.cloud`) && HeaderRegexp(`Upgrade`, `(?i)websocket`)   # was the v2 plural matcher (HeadersRegexp); (?i) kept (D-08)
    traefik.http.routers.thinx-api-ws.priority: "200"
  downtime_downtime:
    traefik.http.routers.downtime-http.rule: PathPrefix(`/`)      # was the v2 host-placeholder catch-all (D-05)
    traefik.http.routers.downtime-http.priority: "2"
    traefik.http.routers.downtime-https.rule: PathPrefix(`/`)     # was the v2 host-placeholder catch-all (D-05)
    traefik.http.routers.downtime-https.priority: "2"
  errorpage_errorpage:
    traefik.http.routers.error-router.rule: PathPrefix(`/`)       # was the v2 host-placeholder catch-all (D-05)
    traefik.http.routers.error-router.priority: "1"
  ruleSyntax labels: ABSENT  # 0/4 after Stage 3 (D-03); 0 ruleSyntax lines in docker-swarm.yml / thinx.yml / downtime.yml / errorpage.yml
  api_readback_15_12Z: "downtime-http@swarm enabled p=2 syn=-; downtime-https@swarm enabled p=2 syn=-; error-router@swarm enabled p=1 syn=-; thinx-api-ws@swarm enabled p=200 syn=- (syn=- = field absent, inherited v3)"
  all_other_live_routers: "26 routers on plain Host() rules — valid v3 syntax; ruleSyntax histogram over all 30 routers {\"-\": 30}"
