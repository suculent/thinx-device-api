traefik_service:
  image: traefik:v3.7.14
  # resolved on micro: traefik@sha256:e849695bc5c317da0cec22bfee4794fd9e15871fe554f864d31b625983e883ff
  # image id sha256:5a93040e5abdf181145d7c242964eca7999ffd700e0447b242ef212f3ee44d55 (pre-pulled 2026-10-07 by Plan 03)
  # Version.Index 38379296 (pre-B1) -> 38379311 (post-B1); Spec.UpdatedAt 2026-10-07T22:04:56Z; UpdateStatus completed.
  # Published host ports — the traefik service itself publishes ONLY 80 and 443 (ingress). UNCHANGED by the hop.
  published_ports:
    - 80:80/tcp     # entrypoint http
    - 443:443/tcp   # entrypoint https
  # Resolved static command (Spec.TaskTemplate.ContainerSpec.Args), in live order — the 17-flag v3 set, index-exact
  # against the committed thinx-swarm/traefik.yml@5e19c00 / docker-compose.traefik.yml (diff empty, email masked):
  command:
    - --providers.swarm                                   # was --providers.docker (v3 split provider)
    - --providers.swarm.constraints=Label(`traefik.constraint-label`, `traefik-public`)   # value byte-identical, backticks intact
    - --providers.swarm.exposedbydefault=true             # WART -> fix-forward P33 (value stays true, namespace moved)
    - --core.defaultRuleSyntax=v2                         # BC switch (D-04): v2 rule syntax until P32 converts natively
    - --entrypoints.http.address=:80
    - --entrypoints.https.address=:443
    - --entrypoints.vpn.address=:1194                     # vestigial: defined, NO router, NOT published by traefik
    - --entrypoints.mqtt.address=:1883                    # vestigial: :1883 published directly by thinx_mosquitto
    - --entrypoints.mqtts.address=:8883                   # vestigial: traefik does NOT publish :8883
    - --entrypoints.thxp.address=:7442                    # vestigial: :7442 published directly by thinx_api (AGENTS.md keep-7442)
    - --certificatesresolvers.le.acme.email=${EMAIL}      # live resolves to a real operator address; kept templated in git (D-10)
    - --certificatesresolvers.le.acme.storage=/certificates/acme.json
    - --certificatesresolvers.le.acme.tlschallenge=true
    - --accesslog
    - --log
    - --log.level=ERROR                                   # WART -> fix-forward P34 (policy choice)
    - --api                                               # WART -> fix-forward P33 (dashboard/API lockdown); NO --api.insecure live
  mounts:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      read_only: true                                     # ro raw docker.sock -> fix-forward P34 (socket-proxy); default swarm endpoint
    - type: volume
      source: traefik_traefik-public-certificates         # swarm-namespaced; committed file names it traefik-public-certificates
      target: /certificates                               # acme.json: 24 certs; rewritten by v3 at first start (see acme_json below)
  configs:
    - config_name: tls-config-1                           # committed: name tls-config-${CONFIG:-1}, so CONFIG=1 live
      target: /traefik/tls.toml
      mode: "0444"                                        # sha256 7e43d8f9… == committed thinx-swarm/traefik/tls.toml (zero drift)
  networks:
    - traefik-public                                      # yw26fv3f…; alias: traefik; external network
  placement:
    - node.labels.Traefik == true                         # only micro carries the label
  env: []                                                 # ContainerSpec.Env is null live (all values are flags/labels)
  # Resolved deploy labels on the traefik service itself (basic-auth hash redacted; DOMAIN templated):
  labels:
    traefik.enable: "true"
    traefik.swarm.network: traefik-public                # v3 swarm-provider key (Stage A added it; B1 removed traefik.docker.network)
    traefik.constraint-label: traefik-public
    traefik.http.middlewares.admin-auth.basicauth.users: ${USERNAME}:<redacted>   # apr1 hash redacted (D-10); unchanged by the hop
    traefik.http.middlewares.https-redirect.redirectscheme.scheme: https
    traefik.http.middlewares.https-redirect.redirectscheme.permanent: "true"
    traefik.http.middlewares.security-headers.headers.browserxssfilter: "true"
    traefik.http.middlewares.security-headers.headers.contenttypenosniff: "true"
    traefik.http.middlewares.security-headers.headers.forcestsheader: "true"
    traefik.http.middlewares.security-headers.headers.framedeny: "true"
    traefik.http.middlewares.security-headers.headers.stsincludesubdomains: "true"
    traefik.http.middlewares.security-headers.headers.stspreload: "true"
    traefik.http.middlewares.security-headers.headers.stsseconds: "31536000"
    traefik.http.middlewares.error-pages-middleware.errors.status: 400-599
    traefik.http.middlewares.error-pages-middleware.errors.service: errorpage
    traefik.http.middlewares.error-pages-middleware.errors.query: /{status}.html
    traefik.http.routers.traefik-public-http.rule: Host(`${DOMAIN}`)
    traefik.http.routers.traefik-public-http.entrypoints: http
    traefik.http.routers.traefik-public-http.middlewares: https-redirect
    traefik.http.routers.traefik-public-https.rule: Host(`${DOMAIN}`)
    traefik.http.routers.traefik-public-https.entrypoints: https
    traefik.http.routers.traefik-public-https.tls: "true"
    traefik.http.routers.traefik-public-https.service: api@internal
    traefik.http.routers.traefik-public-https.tls.certresolver: le
    traefik.http.routers.traefik-public-https.middlewares: admin-auth,error-pages-middleware
    traefik.http.services.traefik-public.loadbalancer.server.port: "8080"
  # Stack bookkeeping labels (not read by Traefik): com.docker.stack.namespace=traefik and
  # com.docker.stack.image=traefik:v2.11@sha256:d57faa4f… — the latter is STALE (only `docker stack deploy` rewrites
  # it; `docker service update --image` does not). Cosmetic; the running image is the v3.7.14 one above.

