      # Phase 32 (EDGE-MIG-03, D-09): the v2 rule-syntax backward-compat switch was removed here after the
      # four v2-only router rules (thinx-api-ws, downtime-http/https, error-router) were converted to native v3.
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Phase 33 (EDGE-TLS-02, D-17..D-19): default middleware for EVERY router on :443, present and future, external
      # stacks included — HSTS max-age=31536000 (one year) + includeSubDomains + preload directive (header only;
      # thinx.cloud is NOT submitted to the preload list), nosniff, frame-deny. Phase 34 (D-15, 33-REVIEW WR-03): the
      # middleware now comes from the file provider (traefik/tls.toml, docker config tls-config-3), so no label update
