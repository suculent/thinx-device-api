      # The file is the docker config `tls-config-${CONFIG}` (see `configs:` below) — never edit it in place.
      - --providers.file.filename=/traefik/tls.toml
      # Enable the access log, with HTTP requests
      - --accesslog
      # Phase 34 (EDGE-OPS-01, D-01..D-04): WARN surfaces provider/label warnings (missing port, router conflicts)
      # without INFO reload noise. Access log kept as JSON; RequestPath (the request URI) and RequestLine
      # (method + URI + protocol) are dropped because query strings carry secrets — OTT tokens on the firmware URL,
      # OAuth codes, reset/activation keys — and Traefik cannot redact only the query. ClientUsername is dropped too
      # (the db/influx basic-auth user — half of a credential pair). Header fields stay at the default drop.
      # Path-level debugging uses the API's own redacted logs.
      - --accesslog.format=json
      - --accesslog.fields.names.RequestPath=drop
      - --accesslog.fields.names.RequestLine=drop
      - --accesslog.fields.names.ClientUsername=drop
      # Enable the Traefik log, for configurations and errors
      - --log
      - --log.level=WARN
      # Enable the Dashboard and API — Phase 33 (EDGE-API-01/02, D-02/D-03): served ONLY on the loopback `mgmt`
      # entrypoint above through the traefik-mgmt router label; there is no public route and no basic-auth any
      # more. Never --api.insecure (that would open an unauthenticated :8080 on every interface).
      - --api
      # D-04 (Phase 30): the inert cleartext `--pilot.token` flag was REMOVED here. Traefik Pilot
      # was discontinued (the flag is a no-op on v2.11 and is rejected by v3); removing it early
      # de-risks the P31 v2->v3 cutover and drops a committed cleartext credential.

    networks:
      # Use the public network created to be shared between Traefik and
      # any other service that needs to be publicly available with HTTPS
      - traefik-public
      # Phase 34 (D-06): Docker API path to socket-proxy only — never shared with traefik-public stacks
      - traefik-socket

  socket-proxy:
    # Phase 34 (EDGE-OPS-02, D-05..D-08): read-only Docker API for the swarm provider — GET-only allow-list of exactly
    # the calls Traefik makes (version, _ping, services, networks, tasks, nodes/<id>; HEAD _ping); every other path and
    # every write method is refused. DHI has no socket-proxy image, so wollomatic/socket-proxy, exact 1.x.y tag, never a
    # digest. Attached ONLY to traefik-socket; -allowfrom is that network's pinned subnet.
    image: wollomatic/socket-proxy:1.13.1
    command:
      - -listenip=0.0.0.0
      - -proxyport=2375
      - -allowfrom=10.234.34.0/24
      - '-allowGET=(/v1\.[0-9]+)?/(_ping|version|services|networks|tasks|nodes/[a-z0-9]+)'
      - '-allowHEAD=(/v1\.[0-9]+)?/_ping'
      - -allowhealthcheck
      - -watchdoginterval=30
      - -stoponwatchdog
      - -shutdowngracetime=5
      - -loglevel=INFO
    # nobody + the host's docker.sock group (998 on micro), so the proxy can read the socket and nothing else
    user: "65534:998"
    read_only: true
    cap_drop:
      - ALL
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-socket
    deploy:
      placement:
        constraints:
          - node.labels.Traefik == true
      resources:
        limits:
          cpus: '0.10'
          memory: 32M
        reservations:
          memory: 8M
      restart_policy:
        condition: any

volumes:
  # Create a volume to store the certificates, there is a constraint to make sure
  # Traefik is always deployed to the same Docker node with the same volume containing
  # the HTTPS certificates
  traefik-public-certificates:

networks:
  # Use the previously created public network "traefik-public", shared with other
  # services that need to be publicly available via this Traefik
  traefik-public:
    external: true
  # Phase 34 (D-06): created by traefik.sh — overlay, internal (no egress), NOT attachable, pinned subnet 10.234.34.0/24;
  # attached only to traefik + socket-proxy, never to traefik-public stacks
  traefik-socket:
    external: true
  net:
    driver: overlay
    attachable: true

# https://medium.com/@jakub.hajek/container-orchestration-with-traefik-2-x-and-docker-swarm-with-canary-deployment-27e7ea62af6f
configs:
  tls-config:
    # Phase 33 (EDGE-TLS-01, D-13): swarm configs are immutable — to change tls.toml bump CONFIG,
    # `docker config create tls-config-<N>` the new name FROM the micro checkout
    # (/mnt/gluster/deployment/swarm/traefik/tls.toml after the ff-merge, so deployed bytes == committed bytes),
    # then `docker service update --config-rm tls-config-<N-1> --config-add source=tls-config-<N>,target=/traefik/tls.toml,mode=0444`
    # (+ one task restart). Never `docker stack deploy` for this.
    name: tls-config-${CONFIG:-3}
    file: ./traefik/tls.toml # or /mnt/data/ingress/traefik/tls.toml
