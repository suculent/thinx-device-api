        # committed file, so a redeploy from here would have dropped security-headers@docker.
        - traefik.http.middlewares.security-headers.headers.browserxssfilter=true
        - traefik.http.middlewares.security-headers.headers.contenttypenosniff=true
        - traefik.http.middlewares.security-headers.headers.forcestsheader=true
        - traefik.http.middlewares.security-headers.headers.framedeny=true
        - traefik.http.middlewares.security-headers.headers.stsincludesubdomains=true
        - traefik.http.middlewares.security-headers.headers.stspreload=true
        - traefik.http.middlewares.security-headers.headers.stsseconds=31536000

        # LOAD-BEARING (Phase 33 research): the v3 swarm provider skips any traefik-enabled service
        # without an explicit service port ("port is missing") and would drop the shared middlewares
        # above/below (https-redirect, security-headers, error-pages-middleware) for every router that
        # references them. api@internal ignores this service; the provider does not. Keep it.
        - traefik.http.services.traefik-public.loadbalancer.server.port=8080

        # Phase 33 (EDGE-API-01/02, D-01..D-03): the public dashboard routers (micro hostname) and their
        # basic-auth are gone. The API/dashboard is reachable ONLY inside the task on the loopback `mgmt`
        # entrypoint (--entrypoints.mgmt.address=127.0.0.1:8080):
