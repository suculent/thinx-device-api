      labels:
        # Enable Traefik for this service, to make it available in the public network
        - traefik.enable=true

        # Use the traefik-public network (declared below). The v3 swarm provider reads
        # traefik.swarm.network (the v2 docker provider read the docker-network label instead).
        - traefik.swarm.network=traefik-public

        # Use the custom label "traefik.constraint-label=traefik-public"
        # This public Traefik will only use services with this label
        # That way you can add other internal Traefik instances per stack if needed
        - traefik.constraint-label=traefik-public

        # Phase 33 (EDGE-API-01/02, D-01, D-04): the basic-auth middleware that guarded the public dashboard
        # router was removed together with that router — nothing consumes USERNAME / HASHED_PASSWORD / DOMAIN
