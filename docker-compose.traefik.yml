      # defined here but NOT host-published by Traefik (Traefik publishes only :80/:443).
      # Device/MQTT traffic is published DIRECTLY, outside Traefik: :7442 (thxp) by thinx_api,
      # :1883 (mqtt) and :8883 (mqtts) by thinx_mosquitto; :1194 (vpn) has no router at all.
      # The dead `mosquitto-secure` TCP router (mqtts entrypoint, via thinx_mosquitto labels)
      # receives no host traffic through Traefik today. Comments only, no functional change — the
      # direct-publish model stays and :7442 plaintext + plain MQTT keep working for legacy
      # __DISABLE_HTTPS__ devices (AGENTS.md keep-7442, D-02).
      # Create an entrypoint "vpn" listening on port 1194/udp
      - --entrypoints.vpn.address=:1194
      # Create an entrypoint "mqtt" listening on port 1883
      - --entrypoints.mqtt.address=:1883
      # Create an entrypoint "mqtts" listening on port 8883
      - --entrypoints.mqtts.address=:8883
      # Create an entrypoint "thxp" listening on port 7442
      - --entrypoints.thxp.address=:7442
      # Phase 33 (EDGE-API-01, D-02): loopback-only management entrypoint for api@internal — bound to 127.0.0.1
