version: '2.2'
networks:
  nat:
    external: false
  internal:
    external: false
services:
  mosquitto:
    env_file: .env
    build: ./services/broker
    ports:
      - '1883:1883' # mqtt
      - '1884:1883' # mqtts
      - '8883:8883' # websocket
    restart: unless-stopped
    networks:
      - nat
      - internal
    labels:
      - traefik.backend.mosquitto.noexpose
  couchdb:
    env_file: .env
    image: 'dhi.io/couchdb:3' # needs `docker login dhi.io` (see .circleci test job)
    restart: unless-stopped
    environment:
      - 'NODENAME=${NODENAME}'
      - 'COUCHDB_USER=${COUCHDB_USER}'
      - 'COUCHDB_PASSWORD=${COUCHDB_PASS}'
      - 'COUCHDB_ADMIN=${COUCHDB_USER}'
      - 'COUCHDB_PASS=${COUCHDB_PASS}'
      - 'COUCHDB_COOKIE=${COUCHDB_COOKIE}'
      - 'COUCHDB_SECRET=${COUCHDB_SECRET}'
    ports:
      - 5984:5984
    networks:
      - nat
      - internal
  thinx-redis:
    env_file: .env
    networks:
      - internal
    image: thinxcloud/redis
    command:
      - redis-server
      - '--requirepass'
      - '${REDIS_PASSWORD}'
      - '--port'
      - '6379'
    environment:
      - 'ALLOW_EMPTY_PASSWORD=no'
      - 'REDIS_PASSWORD=${REDIS_PASSWORD}'
      - 'REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL'
    restart: unless-stopped
    ports:
      - 6379
    labels:
      - traefik.backend.thinx-redis
  transformer:
    env_file: .env
    user: transformer
    image: thinxcloud/transformer
    restart: unless-stopped
    environment:
      - 'ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}'
      - 'ROLLBAR_ENVIRONMENT=${ROLLBAR_ENVIRONMENT}'
      - 'REVISION=1'
    networks:
      - internal
    ports:
      - 7474
    labels:
      - traefik.backend.transformer.noexpose

  worker:
    env_file: .env
    image: thinxcloud/worker:latest
#    build: ./services/worker
    restart: unless-stopped
    environment:
      - "ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}"
      - "ROLLBAR_ENVIRONMENT=${ROLLBAR_ENVIRONMENT}"
      - "THINX_SERVER=${THINX_SERVER}"
      - "WORKER_SECRET=${WORKER_SECRET}"
    networks:
      - internal
    labels:
      - traefik.backend.worker.noexpose
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker
      - /cache
      
  api:
    privileged: true
    shm_size: 2048M
    restart: "no"
    # NOTE: no `condition: service_healthy` on mosquitto — the broker's go-auth
    # plugin only accepts the thinx credential AFTER api injects it at boot
    # (inject_password), so any auth-based mosquitto healthcheck deadlocks
    # (api waits for healthy ⇄ healthy needs api). Start-order + the app's own
    # MQTT reconnect (messenger.js) + UV_THREADPOOL_SIZE below cover readiness.
    depends_on:
      - transformer
      - thinx-redis
      - mosquitto
      - openbao
    networks:
      - nat
      - internal
    env_file: .env
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - 'COUCHDB_PASS=${COUCHDB_PASS}'
        - 'COUCHDB_USER=${COUCHDB_USER}'
        - 'ENVIRONMENT=${ENVIRONMENT}'
        - 'ENTERPRISE=${ENTERPRISE}'
        - 'REDIS_PASSWORD=${REDIS_PASSWORD}'
        - 'REVISION=${REVISION}'
        - 'ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}'
        - 'ROLLBAR_ENVIRONMENT=${ROLLBAR_ENVIRONMENT}'
        - 'THINX_HOSTNAME=${THINX_HOSTNAME}'
        - 'THINX_OWNER_EMAIL=${THINX_OWNER_EMAIL}'
        - 'WORKER_SECRET=${WORKER_SECRET}'
        - 'MAILGUN_API_KEY=${MAILGUN_API_KEY}'
        - 'GIT_KEY_PASSPHRASE=${GIT_KEY_PASSPHRASE:-thinx}'
    environment:
      # Node resolves hostnames via libuv's thread pool (default 4 threads). The
      # messenger opens a per-owner MQTT client, so a load-heavy spec run fires
      # many concurrent getaddrinfo("mosquitto") calls that saturate the 4-thread
      # pool and Docker's embedded DNS, surfacing as `getaddrinfo EAI_AGAIN
      # mosquitto` and cascading MQTT-dependent spec failures. Widen the pool so
      # concurrent lookups don't starve. Test-only; no production impact.
      - 'UV_THREADPOOL_SIZE=64'
      - 'COUCHDB_PASS=${COUCHDB_PASS}'
      - 'COUCHDB_USER=${COUCHDB_USER}'
      - 'ENVIRONMENT=${ENVIRONMENT}'
      - 'ENTERPRISE=${ENTERPRISE}'
      - 'GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}'
      - 'GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}'
      - 'GITHUB_SECRET=${GITHUB_SECRET}'
      - 'GOOGLE_OAUTH_ID=${GOOGLE_OAUTH_ID}'
      - 'GOOGLE_OAUTH_SECRET=${GOOGLE_OAUTH_SECRET}'
      - 'REDIS_PASSWORD=${REDIS_PASSWORD}'
      - 'REVISION=${REVISION}'
      - 'ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}'
      - 'ROLLBAR_ENVIRONMENT=${ROLLBAR_ENVIRONMENT}'
      - 'SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}'
      - 'SLACK_CLIENT_ID=${SLACK_CLIENT_ID}'
      - 'SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET}'
      - 'SLACK_WEBHOOK=${SLACK_WEBHOOK}'
      - 'THINX_HOSTNAME=${THINX_HOSTNAME}'
      - 'THINX_OWNER_EMAIL=${THINX_OWNER_EMAIL}'
      - 'WORKER_SECRET=${WORKER_SECRET}'
      - 'GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}'
      - 'MAILGUN_API_KEY=${MAILGUN_API_KEY}'
      - 'CIRCLE_NODE_INDEX=${CIRCLE_NODE_INDEX}'
      - 'CIRCLE_NODE_TOTAL=${CIRCLE_NODE_TOTAL}'
      # Coveralls upload runs inside this container (see `npm test`). The token
      # and CircleCI build metadata must be forwarded explicitly; nothing from
      # the CircleCI job environment reaches the container otherwise.
      - 'COVERALLS_REPO_TOKEN=${COVERALLS_REPO_TOKEN}'
      - 'CIRCLECI=${CIRCLECI}'
      - 'CIRCLE_SHA1=${CIRCLE_SHA1}'
      - 'CIRCLE_BRANCH=${CIRCLE_BRANCH}'
      - 'CIRCLE_BUILD_NUM=${CIRCLE_BUILD_NUM}'
      - 'CIRCLE_WORKFLOW_ID=${CIRCLE_WORKFLOW_ID}'
      - 'CI_PULL_REQUEST=${CI_PULL_REQUEST}'
      # InfluxDB 2 started by the influxdb + influxdb-setup pair below. The
      # token is a throwaway for that ephemeral CI instance, never a
      # production credential (production reads the INFLUXDB_TOKEN secret).
      - 'INFLUXDB_URL=http://influxdb:8086'
      - 'INFLUXDB_TOKEN=thinx-ci-influx-token'
      # OpenBao dev server started by the openbao + openbao-setup pair below.
      # The role_id and secret_id are throwaways pinned by openbao-setup for
      # that ephemeral CI instance, never production credentials (production
      # reads the BAO_ROLE_ID and BAO_SECRET_ID secret files).
      - 'BAO_ADDR=https://openbao:8200'
      - 'BAO_CACERT=/run/openbao-dev/vault-ca.pem'
      - 'BAO_ROLE_ID=thinx-ci-bao-role'
      - 'BAO_SECRET_ID=thinx-ci-bao-secret'
      # Phase 41: the dev server's throwaway root token (AR-40-01), for the
      # rotate / config calls of spec/jasmine/TransitRotationSpec.js only. Never
      # a production credential, deliberately not named BAO_TOKEN, and never in
      # thinx.yml or docker-swarm.yml.
      - 'BAO_DEV_ADMIN_TOKEN=thinx-ci-bao-root'
    ports:
      - '7442:7442'
      - '7443:7443'
      - '3000' # worker socket
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '/var/lib/docker'
      - '/cache'
      - '/mnt/data/statistics:/mnt/data/statistics'
      - '/mnt/data/repos:/mnt/data/repos'
      - 'openbao-devtls:/run/openbao-dev:ro'
    labels:
      - traefik.docker.network=nat
      - traefik.enable=true
      - traefik.port=7442
      - traefik.backend=thinx-api
      - 'traefik.frontend.rule=Host:${THINX_HOSTNAME}'

  console:
    depends_on:
      - api
    env_file:
      - .env
    build:
      context: ./services/console/src
      args:
        - 'LANDING_HOSTNAME=${LANDING_HOSTNAME}'
        - 'WEB_HOSTNAME=${WEB_HOSTNAME}'
        - 'API_HOSTNAME=${API_HOSTNAME}'
        - 'API_BASEURL=${API_BASEURL}'
        - 'ENTERPRISE=${ENTERPRISE}'
        - 'ENVIRONMENT=${ENVIRONMENT}'
        - 'GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID}'
        - 'ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}'
        - 'CRISP_WEBSITE_ID=${CRISP_WEBSITE_ID}'
    networks:
      - nat
      - internal
#    logging:
#      driver: none
    ports:
      - '8000:80'
    restart: unless-stopped # may be required for updating SSL certs
    environment:
      - 'LANDING_HOSTNAME=${LANDING_HOSTNAME}'
      - 'WEB_HOSTNAME=${WEB_HOSTNAME}'
      - 'API_HOSTNAME=${API_HOSTNAME}'
      - 'API_BASEURL=${API_BASEURL}'
      - 'ENTERPRISE=${ENTERPRISE}'
      - 'ENVIRONMENT=${ENVIRONMENT}'
      - 'GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID}'
      - 'ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}'
      - 'CRISP_WEBSITE_ID=${CRISP_WEBSITE_ID}'
    labels:
      - traefik.enable=true
      - traefik.port=80
      - traefik.backend=console
      - 'traefik.frontend.rule=Host:${WEB_HOSTNAME}'
      - 'traefik.frontend.entryPoints=http,https'
      - traefik.frontend.headers.SSLRedirect=false
      - traefik.frontend.headers.SSLForceHost=true
      - 'traefik.frontend.headers.SSLHost=${WEB_HOSTNAME}'
#      - traefik.frontend.headers.forceSTSHeader=true
#      - traefik.frontend.headers.STSSeconds=315360000
#      - traefik.frontend.headers.STSIncludeSubdomains=true
#      - traefik.frontend.headers.STSPreload=true

  # Phase 27: InfluxDB 2 for the influx specs (success criterion 3). The DHI
  # image is configured by INFLUXD_* env only (D-16) and keeps its data on a
  # tmpfs, so no host path is touched. DHI ignores DOCKER_INFLUXDB_INIT_*, so
  # the influxdb-setup one-shot below onboards it.
  influxdb:
    image: dhi.io/influxdb:2.9.1
    ports:
      - '8086'
    networks:
      - internal
    tmpfs:
      - '/var/lib/influxdb2:uid=65532,gid=65532'
    environment:
      - INFLUXD_BOLT_PATH=/var/lib/influxdb2/influxd.bolt
      - INFLUXD_ENGINE_PATH=/var/lib/influxdb2/engine
      - INFLUXD_REPORTING_DISABLED=true

  # One-shot onboarding with the official image (DHI ships no influx CLI).
  # Creates org thinx and bucket stats with infinite retention, so the specs
  # exercise the real boot repair to 90 days. thinx-ci-influx-token is a
  # throwaway for this ephemeral CI instance, never a production credential.
  influxdb-setup:
    image: influxdb:2.9.1
    depends_on:
      - influxdb
    networks:
      - internal
    restart: "no"
    entrypoint:
      - sh
      - -c
      - >-
        i=0; until influx ping --host http://influxdb:8086 >/dev/null 2>&1;
        do i=$$((i+1)); [ $$i -gt 60 ] && exit 1; sleep 1; done;
        influx setup --host http://influxdb:8086 --force
        --username thinx-ci --password thinx-ci-password
        --org thinx --bucket stats --token thinx-ci-influx-token

  # Phase 40: OpenBao 2.7.1 dev server for the Transit specs (KEYENC-05), the
  # tag production runs. -dev-tls writes vault-ca.pem and a leaf whose SANs
  # include the container hostname (hence hostname: openbao) and 127.0.0.1
  # into the openbao-devtls volume. thinx-ci-bao-root is a throwaway root
  # token for this ephemeral instance. Never print this service's log: the
  # dev server writes its root token and unseal key there.
  openbao:
    image: openbao/openbao:2.7.1
    hostname: openbao
    networks:
      - internal
    ports:
      - '8200'
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=thinx-ci-bao-root
    command:
      - server
      - -dev
      - -dev-no-store-token
      - -dev-tls
      - -dev-tls-cert-dir=/openbao/file
      - -dev-listen-address=0.0.0.0:8200
    volumes:
      - 'openbao-devtls:/openbao/file'

  # One-shot setup, like influxdb-setup: the thinx-deploy-keys Transit key and
  # the thinx-api AppRole with the production policy and role parameters
  # (thinx-swarm openbao/policies/thinx-api.hcl, scripts/openbao-bootstrap.sh).
  # role_id thinx-ci-bao-role and secret_id thinx-ci-bao-secret are CI
  # throwaways for this ephemeral instance, never production credentials.
  openbao-setup:
    image: openbao/openbao:2.7.1
    depends_on:
      - openbao
    networks:
      - internal
    restart: "no"
    volumes:
      - 'openbao-devtls:/devtls:ro'
    environment:
      - BAO_ADDR=https://openbao:8200
      - BAO_CACERT=/devtls/vault-ca.pem
      - BAO_TOKEN=thinx-ci-bao-root
    entrypoint:
      - sh
      - -c
      - >-
        i=0; until [ -f /devtls/vault-ca.pem ] && bao status >/dev/null 2>&1;
        do i=$$((i+1)); [ $$i -gt 60 ] && exit 1; sleep 1; done;
        bao secrets enable transit >/dev/null &&
        bao write -f transit/keys/thinx-deploy-keys type=aes256-gcm96 exportable=false allow_plaintext_backup=false >/dev/null &&
        bao write transit/keys/thinx-deploy-keys/config deletion_allowed=false >/dev/null &&
        bao auth enable approle >/dev/null &&
        printf '%s\n'
        'path "transit/encrypt/thinx-deploy-keys" {' '  capabilities = ["update"]' '}' ''
        'path "transit/decrypt/thinx-deploy-keys" {' '  capabilities = ["update"]' '}' ''
        'path "transit/rewrap/thinx-deploy-keys" {' '  capabilities = ["update"]' '}'
        | bao policy write thinx-api - >/dev/null &&
        bao write auth/approle/role/thinx-api token_policies=thinx-api token_no_default_policy=true token_type=service
        token_ttl=20m token_max_ttl=1h secret_id_ttl=0 secret_id_num_uses=0 bind_secret_id=true >/dev/null &&
        bao write auth/approle/role/thinx-api/role-id role_id=thinx-ci-bao-role >/dev/null &&
        bao write -f auth/approle/role/thinx-api/custom-secret-id secret_id=thinx-ci-bao-secret >/dev/null &&
        echo OPENBAO-SETUP-OK

volumes:
  openbao-devtls: {}
