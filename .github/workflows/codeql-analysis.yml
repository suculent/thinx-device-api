name: "CodeQL"

# Advanced setup. GitHub's CodeQL "default setup" must stay off: the two
# conflict and the SARIF upload from this workflow is rejected while it is on.
# Informational only; this check is not a required status check.
on:
  push:
    branches: [main, thinx-staging]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * 5'

# Least privilege: every job starts read-only, and the one job that needs to
# write gets exactly that scope below. Without this block GITHUB_TOKEN inherits
# the repository default, which can include write access to contents/packages.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      contents: read          # actions/checkout
      security-events: write  # upload the SARIF results to code scanning
      actions: read           # read workflow run metadata (needed on private repos)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript-typescript
        build-mode: none
        queries: security-extended
        config: |
          paths-ignore:
            - node_modules
            - '**/*.min.js'
            - 'builders/lua-inspect/**'
            - 'spec/**'
            - 'scripts/test-*.js'
            - test_cert_probe_runner.js
            - verify_path_traversal_fix.js

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:javascript-typescript"
